name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Enables the manual deploy job below.
  workflow_dispatch:

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # wrangler 4 requires Node 22+; .nvmrc pins the same version locally.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck (client, worker, scripts)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Builds the packs and the client, boots the real Worker, and drives the board in headless
      # Chrome (preinstalled on the runner). No secrets needed — nothing here calls Discord.
      - name: End-to-end
        run: npm run test:e2e

  deploy:
    # Manual only: deploying is not something a push should do by surprise.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
